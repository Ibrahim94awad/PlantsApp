name: plantregistratie
description: Offline plant- en boomregistratie voor Android, iOS en web.
publish_to: none
version: 2.1.0+3

environment:
  sdk: '>=3.6.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  sqflite: ^2.4.3
  sqflite_common_ffi_web: ^1.0.2
  path: ^1.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/plants.csv
    - assets/departments.txt
